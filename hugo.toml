baseURL = "https://c6h8fno4.github.io/hugo/"
locale = "en-us"
theme = "hugo-theme-terminal"
pagination.pagerSize = 5
defaultContentLanguage = "zh"

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.en]
    title = "Terminal"
    subtitle = "A simple, retro theme for Hugo"
    keywords = ""
    copyright = ""
    menuMore = "Show more"
    readMore = "Read more"
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "Terminal"
      logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
      [[languages.en.menu.main]]
        identifier = "showcase"
        name = "Showcase"
        url = "/showcase"

  [languages.zh]
    locale = "zh-cn"
    title = '终端'
    subtitle = "欢迎来到"
    keywords = ""
    copyright = ""
    menuMore = "显示更多"
    readMore = "阅读更多"
    readOtherPosts = "阅读其他文章"

    [languages.zh.params.logo]
      logoText = "终端"
      logoHomeLink = "/"

    [languages.zh.menu]
      [[languages.zh.menu.main]]
        identifier = "about"
        name = "关于"
        url = "/about"
      [[languages.zh.menu.main]]
        identifier = "showcase"
        name = "展示"
        url = "/showcase"
      [[languages.zh.menu.main]]
        identifier = "notes"
        name = "笔记"
        url = "/notes"
      [[languages.zh.menu.main]]
        identifier = "journal"
        name = "日记"
        url = "/journal"
      [[languages.zh.menu.main]]
        identifier = "发癫文案"
        name = "发癫文案"
        url = "/发癫文案"
[caches]
  [caches.images]
    dir = ':cacheDir/images'